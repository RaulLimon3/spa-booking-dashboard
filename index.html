<!doctype html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spa booking dashboard</title>
</head>

<body>
  <div class="layout">
    <aside class="aside">
      <div class="aside__logo">
        <div class="logo">
          <button type="button" class="icon__btn icon__btn--open">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" class="lucide lucide-leaf-icon lucide-leaf icon">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
            </svg>
          </button>
          <span class="logo__text">Spa admin</span>
        </div>
        <button type="button" class="icon__btn icon__btn--close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="lucide lucide-panel-left-close-icon lucide-panel-left-close icon">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M9 3v18" />
            <path d="m16 15-3-3 3-3" />
          </svg>
        </button>
      </div>
      <nav class="navbar">
        <ul class="navbar__list">
          <li class="navbar__item">
            <a href="#" class="navbar__link" aria-current="page" data-section="Dashboard">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-layout-dashboard-icon lucide-layout-dashboard icon">
                <rect width="7" height="9" x="3" y="3" rx="1" />
                <rect width="7" height="5" x="14" y="3" rx="1" />
                <rect width="7" height="9" x="14" y="12" rx="1" />
                <rect width="7" height="5" x="3" y="16" rx="1" />
              </svg>
              <span class="navbar__text">Dashboard</span>
            </a>
          </li>
          <li class="navbar__item">
            <a href="#" class="navbar__link" data-section="Citas">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-calendar-icon lucide-calendar icon">
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
              </svg>
              <span class="navbar__text">Citas</span>
            </a>
          </li>
          <li class="navbar__item">
            <a href="#" class="navbar__link" data-section="Clientes">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-book-user-icon lucide-book-user icon">
                <path d="M15 13a3 3 0 1 0-6 0" />
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" />
                <circle cx="12" cy="8" r="2" />
              </svg>
              <span class="navbar__text">Clientes</span>
            </a>
          </li>
          <li class="navbar__item">
            <a href="#" class="navbar__link" data-section="Servicios">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-settings2-icon lucide-settings-2 icon">
                <path d="M14 17H5" />
                <path d="M19 7h-9" />
                <circle cx="17" cy="17" r="3" />
                <circle cx="7" cy="7" r="3" />
              </svg>
              <span class="navbar__text">Servicios</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>
    <header class="header">
      <div class="header__title">
        <h2 class="title__section" id="titleSection">Dashboard</h2>
      </div>
      <div class="header__user">
        <div class="user__data">
          <p class="user__text">Bienvenido <span class="user__name">Raul</span></p>
          <img class="user__icon" src="./src/assets/icons/circle-user-round.svg" alt="Icono de usuario">
        </div>
      </div>
    </header>
    <main class="main">
      <div class="main__content">
        <div class="main__heading">
          <div class="heading__description">
            <p class="description">Panel de control principal.</p>
          </div>
          <div class="heading__button">
            <button type="button" class="btn" id="btnAdd" aria-label="Agregar nueva cita">Nueva cita</button>
          </div>
        </div>
        <section class="main__section" id="dashboardSection">
        </section>
      </div>
    </main>
    <div class="modal" id="modal">
      <div class="modal__content" id="modalContent">
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>

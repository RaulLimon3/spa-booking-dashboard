<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spa booking dashboard</title>
  </head>
  <body>
    <div class="layout">
      <aside class="aside">
        <div class="aside__logo">
          <span class="logo">Logo</span>
        </div>
        <nav class="navbar">
          <ul class="navbar__list">
            <li class="navbar__item">
              <a href="#" class="navbar__link" aria-current="page">Dashboard</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link">Citas</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link">Clientes</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link">Servicios</a>
            </li>
          </ul>
        </nav>
      </aside>
      <header class="header">
        <div class="header__title">
          <h2 class="title__section" id="titleSection">Nombre de la seccion</h2>
        </div>
        <div class="header__user">
          <p class="user__text">Bienvenido <span class="user__name">Raul</span></p>
        </div>
      </header>
      <main class="main">
        <div class="main__content">
          <div class="main__heading">
            <div class="heading__description">
              <p class="description">Lorem ipsum dolor sit amet.</p>
            </div>
            <div class="heading__button">
              <button type="button" class="btn" id="btnAdd" aria-label="Agregar nueva cita">Nueva cita</button>
            </div>
          </div>
          <section class="main__section" id="dashboardSection">
            <h2>Seccion</h2>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
